[package]
name = "tee_system"
version = "0.2.0"
edition = "2021"
default-run = "tee_system"

[dependencies]
axum = { version = "0.7", features = ["macros", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id", "limit", "compression-gzip", "fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

askama = "0.12"
askama_axum = "0.4"

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
fluent-bundle = "0.15"
fluent-syntax = "0.11"
unic-langid = { version = "0.9", features = ["serde"] }

argon2 = "0.5"
base64 = "0.22"
cookie = "0.18"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
