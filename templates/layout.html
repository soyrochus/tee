<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Tee System{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/favicon/favicon-16x16.png">
    <link rel="manifest" href="static/favicon/site.webmanifest">
    <script>
      // Configure Tailwind CDN to honor the `dark` class.
      var tailwind = { config: { darkMode: "class" } };
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <style>
      /* Force light palette even if Tailwind falls back to media-based dark mode. */
      html[data-theme="light"] .dark\:bg-slate-950,
      html[data-theme="light"] .dark\:bg-slate-900,
      html[data-theme="light"] .dark\:bg-slate-800,
      html[data-theme="light"] .dark\:bg-slate-900\/40,
      html[data-theme="light"] .dark\:hover\:bg-slate-800 {
        background-color: #ffffff !important;
      }
      html[data-theme="light"] .dark\:text-slate-100,
      html[data-theme="light"] .dark\:text-slate-200,
      html[data-theme="light"] .dark\:text-slate-300,
      html[data-theme="light"] .dark\:text-slate-400 {
        color: #0f172a !important;
      }
      html[data-theme="light"] .dark\:border-slate-700,
      html[data-theme="light"] .dark\:border-red-800 {
        border-color: #e2e8f0 !important;
      }
    </style>
    <script>
      // Theme handling: light, dark, or system preference.
      (function() {
        const key = "theme";
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
        const baseHtmlLight = "min-h-full bg-slate-50 text-slate-900";
        const baseHtmlDark = "min-h-full bg-slate-950 text-slate-100";
        const baseBodyLight = "min-h-full bg-slate-50 text-slate-900 transition-colors duration-200";
        const baseBodyDark = "min-h-full bg-slate-950 text-slate-100 transition-colors duration-200";

        function readPref() {
          try { return localStorage.getItem(key) || "system"; }
          catch (_) { return "system"; }
        }

        function writePref(mode) {
          try { localStorage.setItem(key, mode); } catch (_) { /* ignore */ }
        }

        function applyTheme(mode) {
          const useDark = mode === "dark" || (mode === "system" && prefersDark.matches);

          // Reset base classes depending on target theme to avoid mixed states.
          document.documentElement.className = useDark ? baseHtmlDark : baseHtmlLight;
          if (document.body) {
            document.body.className = useDark ? baseBodyDark : baseBodyLight;
          }

          if (useDark) {
            document.documentElement.classList.add("dark");
            if (document.body) document.body.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            if (document.body) document.body.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }

          document.documentElement.dataset.theme = mode;
        }

        const initial = readPref();
        applyTheme(initial);

        prefersDark.addEventListener("change", () => {
          if (readPref() === "system") {
            applyTheme("system");
          }
        });

        window.__setTheme = (mode) => {
          writePref(mode);
          applyTheme(mode);
        };

        window.__getTheme = () => readPref();
      })();
    </script>
    {# Optional progressive enhancement:
       <script src="/static/htmx.min.js" defer></script>
    #}
  </head>
  <body class="min-h-full bg-slate-50 text-slate-900 transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100">
    <header class="bg-white shadow-sm transition-colors duration-200 dark:bg-slate-900 dark:shadow-none">
      <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
        <div class="text-lg font-semibold">{{ layout.brand }}</div>
        <nav class="flex items-center gap-4 text-sm font-medium text-slate-700 dark:text-slate-200">
          <a class="hover:text-blue-600 dark:hover:text-blue-300" href="/tasks">{{ layout.nav_tasks }}</a>
          <form method="post" action="/i18n/locale" class="flex items-center gap-2 text-xs font-semibold text-slate-600 dark:text-slate-300">
            <label class="flex items-center gap-2" for="locale-select">
              {{ layout.locale_label }}
              <select name="locale" id="locale-select" class="rounded-lg border-slate-300 text-sm shadow-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100" onchange="this.form.submit()">
                {% for opt in locale_options %}
                  <option value="{{ opt.code }}" {% if opt.selected %}selected{% endif %}>{{ opt.label }}</option>
                {% endfor %}
              </select>
            </label>
            <input type="hidden" name="redirect_to" id="locale-redirect" value="/" />
          </form>
          <label class="flex items-center gap-2 text-xs font-semibold text-slate-600 dark:text-slate-300" for="theme-select">
            {{ layout.theme_label }}
            <select id="theme-select" class="rounded-lg border-slate-300 text-sm shadow-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
              <option value="light">{{ layout.theme_light }}</option>
              <option value="dark">{{ layout.theme_dark }}</option>
              <option value="system">{{ layout.theme_system }}</option>
            </select>
          </label>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-8">
      {% block content %}{% endblock %}
    </main>
    <script>
      // Initialize theme selector after DOM is ready.
      (function() {
        const sel = document.getElementById("theme-select");
        if (!sel || !window.__getTheme || !window.__setTheme) return;
        const mode = window.__getTheme() || "system";
        sel.value = mode;
        window.__setTheme(mode);
        sel.addEventListener("change", () => window.__setTheme(sel.value));
      })();
      (function() {
        const redirectInput = document.getElementById("locale-redirect");
        if (redirectInput) {
          redirectInput.value = window.location.pathname + window.location.search;
        }
      })();
    </script>
  </body>
</html>
