openapi: 3.0.3
info:
  title: Tee Task API
  version: 1.0.0
  description: |
    OpenAPI specification for the Task-related REST API of the Tee project.
    This file is intended as a machine-readable contract for code generation
    tools and as precise reference documentation for implementers.
servers:
  - url: https://api.example.org
    description: Production server (replace for local dev)
  - url: http://localhost:8000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TaskStatus:
      type: string
      enum: [PLANNED, IN_PROGRESS, COMPLETED]
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        title:
          type: string
          example: "Write project spec"
        description:
          type: string
          example: "Write the API and implementation guide for Tee."
        status:
          $ref: '#/components/schemas/TaskStatus'
        created_at:
          type: string
          format: date-time
          example: "2025-12-26T12:34:56Z"
        updated_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          format: int32
          example: 3
        row_version:
          type: integer
          format: int64
          example: 1
    NewTask:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        due_at:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          format: int32
      required: [title]
      example:
        title: "New task"
        description: "Details"
        priority: 2
    UpdateTask:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        due_at:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
      example:
        title: "Updated title"
        status: "IN_PROGRESS"
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
      example:
        error: "Task not found"
paths:
  /api/v1/tasks:
    get:
      summary: List tasks
      description: Return a paginated list of tasks. Supports query params for pagination and filtering.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTask'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a task by id
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Soft-delete a task
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted (no content)
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/{id}/start:
    post:
      summary: Mark a task started (PLANNED -> IN_PROGRESS)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task started (returns updated task)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
  /api/v1/tasks/{id}/complete:
    post:
      summary: Mark a task completed (IN_PROGRESS -> COMPLETED)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task completed (returns updated task)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
security:
  - bearerAuth: []
